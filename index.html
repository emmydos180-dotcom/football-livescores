<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

    <title>Football Livescores</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
            overflow-x: hidden;
        }

        * {
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            background: #bf0000;
            color: #ffffff;
            padding: 12px 8px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
        }

        .score-container {
            width: 100%;
            padding: 10px;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .score-container iframe {
            display: block;
            width: 100%;
            max-width: 460px;
            height: 470px;
            border: 0;
            border-radius: 12px;
            background: #ffffff;
        }

        @media screen and (max-width: 480px) {
            .header {
                font-size: 18px;
                padding: 11px 5px;
            }

            .score-container {
                padding: 6px;
            }

            .score-container iframe {
                width: 100%;
                height: 470px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        ⚽ LIVE FOOTBALL SCORES
    </div>

    <div class="score-container">

        <iframe
            src="https://footballdata.io/widget/livescore?theme=light&accent=ff0000&refresh=60"
            loading="lazy"
            title="Football Live Scores">
        </iframe>

    </div>

</body>

</html>
